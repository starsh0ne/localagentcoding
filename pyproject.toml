[project]
name = "agent-pro"
version = "1.0.4"
description = "分阶段自研 Agent 应用 (v0.1 → v1.0，生产就绪并发改造)"
readme = "docs/CHANGELOG.md"
requires-python = ">=3.10"
dependencies = [
    # v0.2 核心
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # v0.3 工具
    "langchain-community>=0.2",
    # v0.5 RAG
    "langchain-text-splitters>=0.2",
    # v0.7 API
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # v0.8 可观测性
    "langchain-core>=0.2",
]

[project.optional-dependencies]
# v0.9 状态持久化后端(可选): 安装后启用 Redis 持久化; 未装则降级内存态(不阻断启动)
redis = ["redis>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_pro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
