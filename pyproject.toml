[project]
name = "agent-pro"
version = "0.1.0"
description = "分阶段自研 Agent 应用 (v0.1 → v0.8)"
readme = "docs/CHANGELOG.md"
requires-python = ">=3.10"
dependencies = [
    # v0.2 核心
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # v0.3 工具
    "langchain-community>=0.2",
    # v0.5 RAG
    "langchain-text-splitters>=0.2",
    # v0.7 API
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # v0.8 可观测性
    "langchain-core>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_pro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
